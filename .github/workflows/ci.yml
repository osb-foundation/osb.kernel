name: CI (develop)

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout osb.kernel
        uses: actions/checkout@v4

      - name: Checkout osb.core
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osb.core
          path: ../osb.core

      - name: Checkout osbkt
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osbkt
          path: ../osbkt

      - name: Checkout osb.shell
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osb.shell
          path: ../osb.shell

      - name: Checkout osb.oslang
        uses: actions/checkout@v4
        with:
          repository: osb-foundation/osb.oslang
          path: ../osb.oslang

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang lld grub-pc-bin xorriso

      - name: Run OSB kernel CI (version validation, build, unit tests, ELF + ABI check)
        run: ./scripts/ci.sh
