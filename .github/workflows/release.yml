name: Release (master)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release origin (approved Git Flow)
        # Publication is only ever allowed from master. This guard makes the
        # branch restriction explicit at the workflow level so neither a push
        # nor a manual workflow_dispatch from any other branch can reach the
        # publication steps. release.sh re-checks this independently.
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "ERROR: release publication requires refs/heads/master (got ${{ github.ref }})" >&2
            exit 1
          fi
          echo "Release origin OK: ${{ github.ref }}"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends clang lld grub-pc-bin xorriso

      - name: Publish OSB release (ISO, checksums, manifest, tag, GitHub Release)
        run: ./scripts/release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}